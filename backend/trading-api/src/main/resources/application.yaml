spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:trading_platform;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  jpa:
    database-platform: ${DB_DIALECT:org.hibernate.dialect.H2Dialect}
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${SHOW_SQL:false}

app:
  jwt:
    secret: ${JWT_SECRET:change-this-development-secret-to-at-least-32-characters}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}

gemini:
  api:
    key: ${GEMINI_API_KEYS:${GEMINI_API_KEY:AQ_YOUR_API_KEY_HERE}}
  model: ${GEMINI_MODEL:gemini-2.5-flash}

google:
  ai:
    api-key: ${GEMINI_API_KEYS:${GEMINI_API_KEY:AQ_YOUR_API_KEY_HERE}}

vision:
  provider: ${VISION_PROVIDER:gemini}

market:
  fallback-prices:
    BTCUSDT: 77500
    ETHUSDT: 3500
    SOLUSDT: 180
    EURUSD: 1.08
    GBPUSD: 1.27
