    <path d="M17 25V16M14 19h6M14 25h6M26 32V12M23 15h6M23 28h6" stroke="url(#snapchart-logo-gradient)" stroke-linecap="round" stroke-width="2.2" />
    <circle cx="34" cy="15" r="3" fill="#00F0FF" stroke="#D9FEFF" stroke-width="1" />
    <path d="m34 10 1.2 3.8L39 15l-3.8 1.2L34 20l-1.2-3.8L29 15l3.8-1.2L34 10Z" fill="#D9FEFF" />
