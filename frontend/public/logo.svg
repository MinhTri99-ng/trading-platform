<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <title>SnapChart Logo</title>
  <desc>Scanner frame with Japanese candlesticks and an Entry signal</desc>
  <defs>
    <linearGradient id="snapchart-logo-gradient" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00F0FF" />
      <stop offset="1" stop-color="#10B981" />
    </linearGradient>
    <filter id="snapchart-logo-glow" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
